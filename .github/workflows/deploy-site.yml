name: Deploy Website

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-deploy:
    concurrency: ci-${{ github.ref }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "lts/*"

      - name: Build
        run: node lib/cli/build.js --production

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: www
          branch: website
          clean: true